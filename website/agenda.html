<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="agenda-page" aria-label="Agenda background">
      <div class="profile-card">
        <div class="photo-mask">
          <img class="uploaded-photo" alt="Uploaded profile" />
        </div>
        <img
          class="profile-frame"
          src="../images/profile_photo_frame.png"
          alt="Hacker House Goa profile photo frame"
        />
      </div>
      <div class="social-icons" aria-label="Social links">
        <img src="../images/180-frame-1948754793-54-30952.svg" alt="X" />
        <img src="../images/181-frame-1948754789-54-30958.svg" alt="Telegram" />
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
